apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../cluster-template-prow.yaml
patches:
  # Use a user-assigned identity for upgrade management clusters.
  - patch: |-
      - op: replace
        path: /spec/type
        value: UserAssignedMSI
      - op: replace
        path: /spec/clientID
        value: ${AZURE_CLIENT_ID_CLOUD_PROVIDER}
      - op: add
        path: /spec/resourceID
        value: /subscriptions/${AZURE_SUBSCRIPTION_ID}/resourceGroups/${CI_RG:=capz-ci}/providers/Microsoft.ManagedIdentity/userAssignedIdentities/${USER_IDENTITY:=cloud-provider-user-identity}
    target:
      kind: AzureClusterIdentity
